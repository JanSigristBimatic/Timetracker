[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "build",
    "dist"
]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = true
reportMissingTypeStubs = false
# PyQt6 stubs mark nearly every getter as Optional (item(), viewport(),
# horizontalHeader(), ...); those widgets always exist here.
reportOptionalMemberAccess = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N802",  # Qt event overrides must keep camelCase names (paintEvent, ...)
    "UP045", # Optional[X] is used consistently across the code base
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
